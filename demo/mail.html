<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inbox — Mail (demo)</title>
  <!-- Test fixture that mirrors the structure of Gmail's compose UI (roles, labels, chips, contenteditable body,
       div-buttons, "Message sent" toast) so WebPilot's email flow can be tested without a real account. -->
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.45 system-ui, "Segoe UI", sans-serif; background: #f6f8fc; color: #1f1f1f; }
    header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; }
    .logo { font-weight: 600; font-size: 20px; color: #444; width: 220px; }
    .search { flex: 1; max-width: 720px; }
    .search input { width: 100%; padding: 12px 18px; border-radius: 24px; border: 0; background: #eaf1fb; font: inherit; }
    .wrap { display: grid; grid-template-columns: 240px 1fr; }
    aside { padding: 8px 12px; }
    .compose-btn { display: inline-flex; align-items: center; gap: 10px; padding: 16px 24px; border-radius: 16px; background: #c2e7ff; font-weight: 600; cursor: pointer; user-select: none; }
    .nav div { padding: 6px 12px; border-radius: 16px; margin-top: 4px; cursor: pointer; }
    .nav div.on { background: #d3e3fd; font-weight: 600; }
    main { background: #fff; border-radius: 16px; margin: 0 16px 16px 0; min-height: 70vh; }
    .row { display: flex; gap: 14px; padding: 10px 16px; border-bottom: 1px solid #eee; cursor: pointer; }
    .row b { width: 180px; }
    .compose { position: fixed; right: 24px; bottom: 0; width: 520px; background: #fff; border-radius: 12px 12px 0 0; box-shadow: 0 8px 30px rgba(0,0,0,.25); display: flex; flex-direction: column; z-index: 5; }
    .compose .hd { display: flex; justify-content: space-between; align-items: center; background: #f2f6fc; padding: 10px 14px; border-radius: 12px 12px 0 0; font-weight: 600; font-size: 13px; }
    .compose .hd img, .compose .hd .Ha { width: 16px; height: 16px; cursor: pointer; display: inline-block; }
    .line { display: flex; align-items: center; gap: 6px; border-bottom: 1px solid #eee; padding: 4px 14px; min-height: 38px; flex-wrap: wrap; }
    .line .lbl { color: #666; font-size: 13px; }
    .chip { background: #e8eaed; border-radius: 12px; padding: 2px 8px; font-size: 13px; }
    .line input { border: 0; outline: 0; font: inherit; flex: 1; min-width: 120px; padding: 6px 0; }
    .body { min-height: 200px; padding: 12px 14px; outline: 0; }
    .ft { display: flex; align-items: center; gap: 10px; padding: 10px 14px; }
    .send { background: #0b57d0; color: #fff; padding: 9px 22px; border-radius: 18px; font-weight: 600; cursor: pointer; user-select: none; }
    .sugg { position: absolute; background: #fff; box-shadow: 0 4px 16px rgba(0,0,0,.2); border-radius: 8px; padding: 4px 0; z-index: 9; }
    .sugg div { padding: 8px 14px; cursor: pointer; }
    .sugg div:hover { background: #f1f3f4; }
    .toast { position: fixed; left: 24px; bottom: 24px; background: #303030; color: #fff; border-radius: 8px; padding: 12px 18px; display: none; gap: 16px; z-index: 20; }
    .toast a { color: #a8c7fa; cursor: pointer; }
    .err { color: #b3261e; font-size: 13px; padding: 0 14px; min-height: 18px; }
  </style>
</head>
<body>
  <header><div class="logo">Mail <span style="font-weight:400;font-size:13px;color:#888">(demo)</span></div>
    <div class="search"><input aria-label="Search mail" role="combobox" aria-autocomplete="list" placeholder="Search mail" /></div></header>
  <div class="wrap">
    <aside>
      <div class="compose-btn T-I T-I-KE L3" role="button" tabindex="0" id="composeBtn">✏️ Compose</div>
      <div class="nav"><div class="on">Inbox</div><div>Starred</div><div>Sent</div><div>Drafts</div></div>
    </aside>
    <main>
      <div class="row"><b>College Office</b><span>Fee receipt for semester 5</span></div>
      <div class="row"><b>Unstop</b><span>New hackathons in Pune this week</span></div>
      <div class="row"><b>Prof. Sharma</b><span>Re: Project review schedule</span></div>
    </main>
  </div>

  <div class="toast bAq-wrap" id="toast" role="alert" aria-live="assertive"><span class="bAq">Message sent</span><a>Undo</a><a>View message</a></div>

  <script>
    const CONTACTS = [{ name: 'Prof. Sharma', email: 'sharma@college.edu' }, { name: 'College Office', email: 'office@college.edu' }];
    const isEmail = (s) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s.trim());
    let sent = [];
    function openCompose() {
      if (document.getElementById('compose')) return;
      const c = document.createElement('div');
      c.className = 'compose'; c.id = 'compose';
      c.setAttribute('role', 'dialog'); c.setAttribute('aria-label', 'New Message');
      c.innerHTML = `
        <div class="hd"><span>New Message</span><span><span class="Ha" role="button" aria-label="Save &amp; close" tabindex="0">✕</span></span></div>
        <div class="line" id="toLine"><span class="lbl">To</span><input class="agP aFw" role="combobox" aria-autocomplete="list" aria-haspopup="listbox" aria-label="To recipients" autocomplete="off" /></div>
        <div class="line"><input name="subjectbox" placeholder="Subject" aria-label="Subject" /></div>
        <div class="body" role="textbox" contenteditable="true" aria-label="Message Body" aria-multiline="true"></div>
        <div class="err" id="cerr"></div>
        <div class="ft"><div class="send" role="button" tabindex="0" aria-label="Send ‪(Ctrl-Enter)‬" data-tooltip="Send ‪(Ctrl-Enter)‬">Send</div></div>`;
      document.body.appendChild(c);
      const to = c.querySelector('input[aria-label="To recipients"]');
      let sugg = null;
      const chips = [];
      const addChip = (email) => {
        if (!isEmail(email)) return false;
        const s = document.createElement('span'); s.className = 'chip'; s.setAttribute('email', email); s.textContent = email;
        to.before(s); chips.push(email); to.value = ''; closeSugg(); return true;
      };
      const closeSugg = () => { if (sugg) { sugg.remove(); sugg = null; } };
      to.addEventListener('input', () => {
        closeSugg();
        const q = to.value.trim().toLowerCase();
        if (q.endsWith(',')) { addChip(q.slice(0, -1)); return; }
        const hits = q ? CONTACTS.filter((p) => p.email.includes(q) || p.name.toLowerCase().includes(q)) : [];
        if (!hits.length) return; // unknown addresses get NO suggestion (like Gmail for a new address)
        sugg = document.createElement('div'); sugg.className = 'sugg'; sugg.setAttribute('role', 'listbox');
        hits.forEach((p) => { const d = document.createElement('div'); d.setAttribute('role', 'option'); d.textContent = `${p.name} <${p.email}>`; d.onmousedown = (e) => { e.preventDefault(); addChip(p.email); }; sugg.appendChild(d); });
        const r = to.getBoundingClientRect(); Object.assign(sugg.style, { left: r.left + 'px', top: r.bottom + 'px' });
        document.body.appendChild(sugg);
      });
      to.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === 'Tab' || e.key === ',') { if (addChip(to.value)) { if (e.key !== 'Tab') e.preventDefault(); } } });
      to.addEventListener('blur', () => setTimeout(() => { if (to.value) addChip(to.value); closeSugg(); }, 120));
      c.querySelector('.Ha').onclick = () => c.remove();
      c.querySelector('.send').onclick = () => {
        if (to.value) addChip(to.value);
        if (!chips.length) { c.querySelector('#cerr').textContent = 'Please specify at least one recipient.'; return; }
        sent.push({ to: [...chips], subject: c.querySelector('[name=subjectbox]').value, body: c.querySelector('[aria-label="Message Body"]').innerText });
        window.__sent = sent;
        c.remove();
        const t = document.getElementById('toast'); t.style.display = 'flex';
      };
    }
    document.getElementById('composeBtn').onclick = openCompose;
  </script>
</body>
</html>
