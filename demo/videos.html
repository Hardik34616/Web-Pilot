<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StreamTube (demo)</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.45 system-ui, "Segoe UI", sans-serif; background: #0f0f0f; color: #f1f1f1; }
    header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid #272727; }
    .logo { font-weight: 800; font-size: 20px; color: #ff4e45; text-decoration: none; }
    form { flex: 1; display: flex; max-width: 560px; }
    input { flex: 1; padding: 9px 14px; border-radius: 20px 0 0 20px; border: 1px solid #303030; background: #121212; color: #fff; font: inherit; }
    button { padding: 0 18px; border-radius: 0 20px 20px 0; border: 1px solid #303030; background: #222; color: #fff; cursor: pointer; }
    main { max-width: 900px; margin: 18px auto; padding: 0 16px; }
    .result { display: flex; gap: 14px; margin-bottom: 18px; }
    .thumb { width: 240px; height: 135px; border-radius: 12px; background: linear-gradient(135deg, #db2777, #7c3aed); position: relative; flex: none; }
    .thumb span { position: absolute; right: 6px; bottom: 6px; background: rgba(0,0,0,.8); font-size: 12px; padding: 1px 5px; border-radius: 4px; }
    .result a.title { color: #fff; text-decoration: none; font-size: 18px; font-weight: 600; }
    .meta { color: #aaa; font-size: 13px; }
    video { width: 100%; aspect-ratio: 16/9; background: linear-gradient(135deg, #db2777, #7c3aed); border-radius: 12px; }
    .muted { color: #aaa; }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="videos.html">▶ StreamTube</a>
    <form action="videos.html" role="search">
      <input name="q" aria-label="Search videos" placeholder="Search" />
      <button aria-label="Search">🔍</button>
    </form>
  </header>
  <main id="main"></main>
  <script>
    const VIDEOS = [
      { id: 'a1', title: 'Grand Theft Auto VI — Official Trailer 1', channel: 'Rockstar Games', views: '310M views', len: '1:31' },
      { id: 'b2', title: 'GTA 6 Trailer Breakdown: Everything You Missed', channel: 'GameSpotlight', views: '4.1M views', len: '18:02' },
      { id: 'c3', title: 'Top 10 Open World Games of 2026', channel: 'PlayList', views: '900K views', len: '12:44' },
    ];
    const p = new URLSearchParams(location.search), main = document.getElementById('main');
    const q = p.get('q'), v = p.get('v');
    if (v) {
      const vid = VIDEOS.find((x) => x.id === v) || VIDEOS[0];
      main.innerHTML = `<video src="files/clip.wav" muted autoplay loop controls></video><h2>${vid.title}</h2><div class="meta">${vid.channel} · ${vid.views} (demo page)</div>`;
    } else if (q) {
      document.querySelector('input').value = q;
      const words = q.toLowerCase().split(/\s+/);
      const hits = VIDEOS.map((x) => [x, words.filter((w) => x.title.toLowerCase().includes(w)).length]).sort((a, b) => b[1] - a[1]).map((x) => x[0]);
      main.innerHTML = hits.map((x) => `<div class="result"><a href="videos.html?v=${x.id}" class="thumb"><span>${x.len}</span></a>
        <div><a class="title" href="videos.html?v=${x.id}">${x.title}</a><div class="meta">${x.channel} · ${x.views}</div></div></div>`).join('');
    } else {
      main.innerHTML = '<p class="muted">Search for a video above. (Demo site — no real videos.)</p>';
    }
  </script>
</body>
</html>
