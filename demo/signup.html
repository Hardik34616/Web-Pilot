<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CodeSprint — Create your account</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 15px/1.5 system-ui, "Segoe UI", sans-serif; background: linear-gradient(135deg, #1e1b4b, #4338ca); color: #0f172a; padding: 16px; }
    .card { width: 100%; max-width: 420px; background: #fff; border-radius: 18px; padding: 28px; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
    h1 { margin: 0 0 4px; font-size: 22px; }
    p.sub { margin: 0 0 18px; color: #64748b; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 12px; color: #334155; }
    input[type=text], input[type=email], input[type=password], input[type=tel] { display: block; width: 100%; margin-top: 5px; padding: 10px 12px; font: inherit; border: 1px solid #cbd5e1; border-radius: 10px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .check { display: flex; gap: 8px; font-weight: 400; align-items: flex-start; }
    .check input { margin-top: 4px; }
    button { width: 100%; padding: 11px; font: inherit; font-weight: 700; color: #fff; background: #4338ca; border: 0; border-radius: 10px; cursor: pointer; margin-top: 6px; }
    .err { color: #dc2626; font-size: 13px; min-height: 18px; margin: 6px 0 0; }
    .ok { text-align: center; }
    .ok .big { font-size: 52px; }
    /* cookie banner, so the agent has a popup to dismiss */
    .cookie { position: fixed; z-index: 10; inset: 0; background: rgba(15,23,42,.55); display: grid; place-items: center; }
    .cookie .box { background: #fff; border-radius: 14px; padding: 20px; max-width: 360px; }
    .cookie .btns { display: flex; gap: 8px; }
    .cookie button.alt { background: #e2e8f0; color: #0f172a; }
  </style>
</head>
<body>
  <div class="card">
    <form id="f" novalidate>
      <h1>Create your CodeSprint account</h1>
      <p class="sub">Join 50,000+ students practising for hackathons.</p>
      <div class="row">
        <label>First name <input type="text" name="first" autocomplete="given-name" required /></label>
        <label>Last name <input type="text" name="last" autocomplete="family-name" required /></label>
      </div>
      <label>Email <input type="email" name="email" autocomplete="email" required /></label>
      <label>College <input type="text" name="college" /></label>
      <label>Password <input type="password" name="password" autocomplete="new-password" required minlength="8" /></label>
      <label>Confirm password <input type="password" name="confirm" autocomplete="new-password" required /></label>
      <label class="check"><input type="checkbox" name="terms" required /> I agree to the Terms of Service and Privacy Policy</label>
      <p class="err" role="alert" id="err"></p>
      <button type="submit">Create account</button>
    </form>
    <div class="ok" id="ok" hidden>
      <div class="big">🎉</div>
      <h1>Account created!</h1>
      <p class="sub">Welcome, <b id="who"></b>. You're signed in. (Demo page — nothing was sent anywhere.)</p>
    </div>
  </div>

  <div class="cookie" id="cookie">
    <div class="box">
      <b>We value your privacy</b>
      <p style="color:#475569;font-size:14px">We use cookies to improve your experience.</p>
      <div class="btns"><button class="alt" id="reject">Reject all</button><button id="accept">Accept all</button></div>
    </div>
  </div>

  <script>
    const f = document.getElementById('f'), err = document.getElementById('err');
    const hideCookie = () => document.getElementById('cookie').remove();
    document.getElementById('reject').onclick = hideCookie;
    document.getElementById('accept').onclick = hideCookie;
    f.addEventListener('submit', (e) => {
      e.preventDefault();
      const d = Object.fromEntries(new FormData(f));
      if (!d.first || !d.last || !d.email) return (err.textContent = 'Please fill in your name and email.');
      if (!/^\S+@\S+\.\S+$/.test(d.email)) return (err.textContent = 'Please enter a valid email address.');
      if ((d.password || '').length < 8) return (err.textContent = 'Password must be at least 8 characters.');
      if (d.password !== d.confirm) return (err.textContent = 'Passwords do not match.');
      if (!f.terms.checked) return (err.textContent = 'You must accept the Terms of Service.');
      f.hidden = true;
      document.getElementById('who').textContent = d.first;
      document.getElementById('ok').hidden = false;
    });
  </script>
</body>
</html>
